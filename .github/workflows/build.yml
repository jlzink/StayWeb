name: Build StayWeb

on:
  push:

permissions:
  contents: read

concurrency:
  group: stayweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cloud-build:
    name: Move builds to the local Mac
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'StayWeb compilation and tests now run locally on the MacBook Pro.'
